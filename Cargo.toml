[package]
name = "TurboRipent"
authors = ["Outerbeast"]
version = "2.1.0"
edition = "2024"
description = "BSP Entity ripping tool"

[dependencies]
glob = "0.3.4"
dialoguer = { version = "0.12.0", default-features = false }
crossterm = { version = "0.28.1", default-features = false, features = ["events", "windows"] }
anyhow = "1.0.104"
strum = "0.28.0"
strum_macros = "0.28.0"
cursive = { version = "0.21.1", default-features = false, features = ["crossterm-backend"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
